name: Production Staging Proof

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full SHA of the current main commit to verify
        required: true
        type: string
      confirmation:
        description: Type VERIFY STAGING to confirm the isolated proof
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: evernest-production-staging-proof
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Validate staging proof request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "VERIFY STAGING"
          test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main
      - name: Bind proof to current main
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$REQUESTED_SHA" | grep -Ec '^[0-9a-fA-F]{40}$')" = "1"
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$REQUESTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify isolated production staging boundary
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/config/supabase-prod-ca-2021.crt
          STAGING_EXPECTED_PROJECT_REF: ${{ vars.STAGING_EXPECTED_PROJECT_REF }}
          STAGING_VERIFIER_DATABASE_URL: ${{ secrets.STAGING_VERIFIER_DATABASE_URL }}
          STAGING_OWNER_EMAIL: ${{ secrets.STAGING_OWNER_EMAIL }}
          STAGING_OWNER_PASSWORD: ${{ secrets.STAGING_OWNER_PASSWORD }}
          STAGING_PROTECTED_PROJECT_REFS: ${{ vars.STAGING_PROTECTED_PROJECT_REFS }}
          STAGING_RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_REVOKED_EMAIL: ${{ secrets.STAGING_REVOKED_EMAIL }}
          STAGING_REVOKED_PASSWORD: ${{ secrets.STAGING_REVOKED_PASSWORD }}
          STAGING_SENTINEL_EVENT_ID: ${{ secrets.STAGING_SENTINEL_EVENT_ID }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_VERIFY_CONFIRMATION: ${{ vars.STAGING_VERIFY_CONFIRMATION }}
        run: |
          set -euo pipefail
          npm run test:staging 2>&1 | tee production-staging-proof.txt
      - name: Verify authenticated staging browser matrix
        env:
          STAGING_OWNER_EMAIL: ${{ secrets.STAGING_OWNER_EMAIL }}
          STAGING_OWNER_PASSWORD: ${{ secrets.STAGING_OWNER_PASSWORD }}
          STAGING_REVOKED_EMAIL: ${{ secrets.STAGING_REVOKED_EMAIL }}
          STAGING_REVOKED_PASSWORD: ${{ secrets.STAGING_REVOKED_PASSWORD }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VERCEL_ENV: production
          VITE_APP_MODE: production
          VITE_ENABLE_DEMO_WORKSPACE: "false"
          VITE_PRIVACY_POLICY_URL: https://evernestcare.vercel.app/privacy
          VITE_REQUIRE_AUTH: "true"
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPPORT_URL: https://evernestcare.vercel.app/support
          VITE_TERMS_URL: https://evernestcare.vercel.app/terms
        run: |
          set -euo pipefail
          npm run test:e2e:staging-browser 2>&1 | tee production-staging-browser-proof.txt
      - name: Record content-free proof identity
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          printf 'release_sha=%s\nresult=PASS\nworkflow_run=%s\n' \
            "$RELEASE_SHA" "$GITHUB_RUN_ID" > production-staging-proof-metadata.txt
      - name: Archive content-free staging proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-staging-proof-${{ inputs.release_sha }}
          path: |
            production-staging-proof.txt
            production-staging-browser-proof.txt
            production-staging-proof-metadata.txt
          if-no-files-found: error
          retention-days: 30
