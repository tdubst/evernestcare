name: Production Baseline Bootstrap

on:
  workflow_dispatch:
    inputs:
      expected_deployment_id:
        description: Vercel deployment ID currently serving the production domain
        required: true
        type: string
      expected_release_sha:
        description: Full Git SHA recorded by the current production release manifest
        required: true
        type: string
      expected_app_mode:
        description: App mode recorded by the current production release manifest
        required: true
        type: choice
        options:
          - beta
          - production
      confirmation:
        description: Type BOOTSTRAP to verify the one-time rollback baseline
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: evernest-production-release
  cancel-in-progress: false

jobs:
  verify-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Validate bootstrap confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "BOOTSTRAP"
          test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify current Vercel production target
        env:
          EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_DEPLOYMENT_ID"
          test "$(printf '%s' "$EXPECTED_RELEASE_SHA" | grep -Ec '^[0-9a-fA-F]{40}$')" = "1"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"
          project_url="https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"
          authorization="Authorization: Bearer $VERCEL_TOKEN"
          printf 'url = "%s"\nheader = "%s"\nsilent\nshow-error\nfail\noutput = "baseline-project.json"\n' \
            "$project_url" "$authorization" | curl --config -
          test "$(jq -r '.autoAssignCustomDomains' baseline-project.json)" = "false"
          test "$(jq -er '.targets.production.id' baseline-project.json)" = "$EXPECTED_DEPLOYMENT_ID"
          project_repo_id="$(jq -er '.link.repoId | tostring' baseline-project.json)"
          deployment_url="https://api.vercel.com/v13/deployments/$EXPECTED_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID"
          printf 'url = "%s"\nheader = "%s"\nsilent\nshow-error\nfail\noutput = "baseline-deployment.json"\n' \
            "$deployment_url" "$authorization" | curl --config -
          test "$(jq -er '.projectId' baseline-deployment.json)" = "$VERCEL_PROJECT_ID"
          test "$(jq -er '.target' baseline-deployment.json)" = "production"
          test "$(jq -er '(.gitSource.repoId // .meta.githubRepoId) | tostring' baseline-deployment.json)" = "$project_repo_id"
          test "$(jq -er '.gitSource.ref // .meta.githubCommitRef' baseline-deployment.json)" = "main"
          test "$(jq -er '.gitSource.sha // .meta.githubCommitSha' baseline-deployment.json)" = "$EXPECTED_RELEASE_SHA"
          git cat-file -e "$EXPECTED_RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" HEAD
      - name: Verify baseline release identity
        env:
          EXPECTED_APP_MODE: ${{ inputs.expected_app_mode }}
          EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          PRODUCTION_HEALTHCHECK_URL: ${{ secrets.PRODUCTION_HEALTHCHECK_URL }}
        run: npm run test:production-deployment
      - name: Verify baseline browser shell
        env:
          PRODUCTION_BROWSER_EXPECTATION: rollback
          PRODUCTION_BROWSER_URL: ${{ secrets.PRODUCTION_HEALTHCHECK_URL }}
        run: npm run test:production-browser
